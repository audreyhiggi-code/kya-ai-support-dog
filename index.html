textarea,input,select{width:100%;padding:11px;border:1px solid #e7c3cd;border-radius:11px;margin:6px 0;font:inherit}.faces button{font-size:28px;border:0;background:var(--soft);border-radius:13px;padding:8px;margin:3px}.result{background:#fff0f4;border-radius:14px;padding:12px;margin-top:10px}.small{font-size:12px;color:#806c72}

<div class="app"><div class="main">

</div>

<script>
let companion="Kya",emo="",skills=JSON.parse(localStorage.skills||"[]"),feelings=JSON.parse(localStorage.feelings||"[]"),voices=[];
const screens={
talk:`<h2>🎙️ Talk to <span class=cn></span></h2><p>Tell your companion about your day or just have some company.</p><button class=action onclick="speak('I am right here with you. What would you like to talk about?')">🔊 Talk Back</button>`,
calm:`<h2>🫁 Help Me Calm Down</h2><div class=grid><button class=card onclick="calm('Take a slow breath in... and slowly breathe out.')"><b>🌬️ Breathe With Me</b></button><button class=card onclick="calm('Name five things you see, four you can feel, three you hear, two you smell, and one thing that helps you feel cared for.')"><b>🌿 5-4-3-2-1</b></button><button class=card onclick="calm('You do not have to explain anything. I can sit quietly with you.')"><b>🐾 Quiet Time</b></button></div><div id=out></div>`,
feel:`<h2>❤️ My Feelings</h2><div class=faces><button onclick="emo='Happy'">😊</button><button onclick="emo='Okay'">😐</button><button onclick="emo='Sad'">😢</button><button onclick="emo='Angry'">😡</button><button onclick="emo='Worried'">😟</button></div><select id=level><option>1 - A little</option><option>2</option><option>3 - Medium</option><option>4</option><option>5 - Very big</option></select><textarea id=what placeholder="What happened?"></textarea><textarea id=help placeholder="What helped or might help?"></textarea><button class=action onclick=saveFeel()>Save Check-In</button><p id=msg></p>`,
games:`<h2>🎮 Educational Games</h2><div class=grid><button class=card onclick="quiz('reading')"><b>🔤 Word Adventure</b>Reading & phonics</button><button class=card onclick="quiz('math')"><b>➕ Number Quest</b>Math</button><button class=card onclick="quiz('memory')"><b>🧠 Memory Challenge</b>Memory & focus</button><button class=card onclick="quiz('sequence')"><b>🔢 Sequencing</b>Order</button><button class=card onclick="quiz('pattern')"><b>🧩 Pattern Detective</b>Patterns</button><button class=card onclick="quiz('spelling')"><b>✏️ Spelling</b>Words</button></div><div id=quizOut></div>`,
journal:`<h2>📔 Journal</h2><textarea id=jtext placeholder="Write what's on your mind..."></textarea><button class=action onclick=saveJournal()>Save Privately</button><p id=jmsg></p>`,
learn:`<h2>🎨 Activities & Learning</h2><div class=grid><button class=card onclick="quiz('reading')"><b>📖 Read With Me</b></button><button class=card onclick=homework()><b>✏️ Homework Helper</b></button><button class=card onclick="quiz('memory')"><b>🧠 Memory & Focus</b></button><button class=card onclick=showStrengths()><b>⭐ My Strengths</b></button><button class=card onclick="openM('calm')"><b>🌬️ Calm Activity</b></button><button class=card onclick="openM('games')"><b>🎮 Learning Games</b></button></div><div id=learnOut></div>`,
settings:`<h2>⚙️ Settings</h2><h3 style="color:var(--pink)">🐾 Choose Your Companion</h3><p class=small>Pick the friend you want to play, read and calm down with.</p><div class="chars settings-chars">
<div class="char active" onclick="pick(this,'Kya','🐶')"><div class="emoji sprite" style="background-position:33.333% 0%"></div><b>Kya</b><small>Support Dog</small></div>

<div class="char" onclick="pick(this,'Audrey','👧🏻')"><div class="emoji sprite" style="background-position:66.667% 0%"></div><b>Audrey</b><small>Creative Friend</small></div>
<div class="char" onclick="pick(this,'Ethan','👦🏻')"><div class="emoji sprite" style="background-position:100% 0%"></div><b>Ethan</b><small>Kind Friend</small></div>
<div class="char" onclick="pick(this,'Nova','🦄')"><div class="emoji sprite" style="background-position:0% 100%"></div><b>Nova</b><small>Dreamy Unicorn</small></div>
<div class="char" onclick="pick(this,'Remi','🦊')"><div class="emoji sprite" style="background-position:33.333% 100%"></div><b>Remi</b><small>Brave Fox</small></div>
<div class="char" onclick="pick(this,'Ziggy','🐲')"><div class="emoji sprite" style="background-position:66.667% 100%"></div><b>Ziggy</b><small>Friendly Dragon</small></div>

function openM(k){content.innerHTML=screens[k];overlay.classList.add("show");refresh();if(k==="voice")loadVoices();if(k==="strengths")showStrengths();if(k==="parent")report();if(k==="background")refreshBackgroundChoices();if(k==="style")themeChoice.value=document.body.className.match(/theme-([a-z]+)/)?.[1]||document.documentElement.dataset.theme||"rose"}function closeM(){overlay.classList.remove("show")}restoreBackground();function refresh(){document.querySelectorAll(".cn").forEach(x=>x.textContent=companion);document.querySelector(".controls .mic").setAttribute("aria-label","Talk to "+companion);document.querySelector(".controls .mic").title="Talk to "+companion}
function pick(el,n,e){document.querySelectorAll(".char").forEach(x=>x.classList.remove("active"));el.classList.add("active");companion=n;{const spots={Kya:'33.333% 0%',Luna:'0% 0%',Audrey:'66.667% 0%',Ethan:'100% 0%',Nova:'0% 100%',Remi:'33.333% 100%',Ziggy:'66.667% 100%',Poppy:'100% 100%'};avatar.innerHTML='<div class="friend-portrait '+n.toLowerCase()+'" style="background-position:'+spots[n]+'" role="img" aria-label="'+n+'"></div>'}refresh();speak("Hi! I'm "+n+". I'm happy to be your companion.")}
function rename(){let n=nval.value.trim();if(n){companion=n;refresh();closeM()}}
function setTheme(theme){if(!["rose","ocean","forest","violet","sunshine"].includes(theme))return;document.documentElement.dataset.theme=theme;localStorage.companionTheme=theme}
let customBackgroundUrl;
function refreshBackgroundChoices(){document.querySelectorAll(".background-choices [data-bg]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.bg===stage.dataset.background)))}
function setBackground(choice){if(!["cozy","garden","dream"].includes(choice))return;if(customBackgroundUrl){URL.revokeObjectURL(customBackgroundUrl);customBackgroundUrl=undefined}const images={cozy:"assets/cozy-room.webp",garden:"assets/garden.webp",dream:"assets/dream.webp"};stage.style.backgroundImage='url("'+images[choice]+'")';stage.style.backgroundSize="cover";stage.style.backgroundPosition="center";stage.style.backgroundRepeat="no-repeat";stage.dataset.background=choice;localStorage.companionBackground=choice;refreshBackgroundChoices()}
function backgroundStore(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("Storage unavailable"));const req=indexedDB.open("my-ai-friend",1);req.onupgradeneeded=()=>req.result.createObjectStore("pictures");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveBackgroundFile(file){const db=await backgroundStore();return new Promise((resolve,reject)=>{const tx=db.transaction("pictures","readwrite");tx.objectStore("pictures").put(file,"background");tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadBackgroundFile(){const db=await backgroundStore();return new Promise((resolve,reject)=>{const tx=db.transaction("pictures","readonly");const req=tx.objectStore("pictures").get("background");req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}})}
function displayCustomBackground(file){if(customBackgroundUrl)URL.revokeObjectURL(customBackgroundUrl);customBackgroundUrl=URL.createObjectURL(file);stage.style.backgroundImage='url("'+customBackgroundUrl+'")';stage.dataset.background="custom";localStorage.companionBackground="custom";refreshBackgroundChoices()}
async function uploadBackground(file){if(!file)return;const message=document.getElementById("backgroundMessage");if(!["image/png","image/jpeg","image/webp"].includes(file.type)||file.size>6*1024*1024){message.textContent="Choose a JPG, PNG, or WebP smaller than 6 MB.";return}displayCustomBackground(file);try{await saveBackgroundFile(file);message.textContent="Your picture is saved on this device."}catch(e){message.textContent="Your picture is showing for this visit, but this browser could not save it."}}
async function restoreBackground(){const choice=localStorage.companionBackground||"cozy";if(choice==="custom"){try{const file=await loadBackgroundFile();if(file){displayCustomBackground(file);return}}catch(e){}setBackground("cozy")}else setBackground(choice)}
function loadVoices(){voices=speechSynthesis.getVoices();if(window.vsel)vsel.innerHTML=voices.map((v,i)=>`<option value=${i}>${v.name} — ${v.lang}</option>`).join("")}if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=loadVoices;
function speak(t){if(!("speechSynthesis"in window))return;stage.classList.add("talking");status.textContent="💗 Talking...";let u=new SpeechSynthesisUtterance(t);if(window.vsel&&voices[+vsel.value])u.voice=voices[+vsel.value];u.rate=window.rate?+rate.value:.95;u.onend=()=>{stage.classList.remove("talking");status.textContent="💗 Ready..."};speechSynthesis.cancel();speechSynthesis.speak(u)}
function stopVoice(){speechSynthesis.cancel();stage.classList.remove("talking","listening");status.textContent="💗 Ready..."}function listenDemo(){stage.classList.add("listening");status.textContent="🎵 Listening...";setTimeout(()=>{stage.classList.remove("listening");speak("I am listening. Tell me what is on your mind.")},1500)}function preview(){speak("Hi! I'm "+companion+". We can talk, learn, play, or calm down together.")}
function calm(t){out.innerHTML=`<div class=result>${t}</div>`;speak(t)}function saveFeel(){if(!emo){msg.textContent="Choose a feeling first.";return}feelings.push({date:new Date().toISOString(),emotion:emo,level:level.value,what:what.value,help:help.value});localStorage.feelings=JSON.stringify(feelings);msg.textContent="Saved 💗"}function saveJournal(){let j=JSON.parse(localStorage.journals||"[]");j.push({date:new Date().toISOString(),text:jtext.value});localStorage.journals=JSON.stringify(j);jmsg.textContent="Saved privately on this device."}

function checkHomework(encoded,correctEncoded){const answer=decodeURIComponent(encoded),correct=decodeURIComponent(correctEncoded),p=homeworkProblems[homeworkPos%homeworkProblems.length];document.querySelectorAll('#learnOut .softbtn').forEach(b=>b.disabled=true);const msg=document.getElementById('homeworkMsg');if(answer===correct){msg.innerHTML="🌟 Great work! You solved it!";}else{msg.innerHTML="💛 Nice try. The answer is <b>"+correct+"</b>.<br><span class=small>"+p[3]+"</span>"}const next=document.getElementById('homeworkNext');if(next){next.hidden=false;next.style.display='inline-block'}}
