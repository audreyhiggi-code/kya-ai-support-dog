</style></head><body><main class="app"><section class="stage" aria-label="Kya app home">
<button id="talk" class="hot" onclick="openM('talkM')" aria-label="Talk to companion"></button>
<button id="calm" class="hot" onclick="openM('calmM')" aria-label="Help me calm down"></button>
<button id="feel" class="hot" onclick="openM('feelM')" aria-label="My feelings"></button>
<button id="games" class="hot" onclick="openM('gamesM')" aria-label="Educational games"></button>
<button id="journal" class="hot" onclick="openM('journalM')" aria-label="Journal"></button>
<button id="learn" class="hot" onclick="openM('learnM')" aria-label="Learning adventures"></button>
<button id="settings" class="hot" onclick="openM('settingsM')" aria-label="Settings"></button>
<button id="parent" class="hot" onclick="openM('parentM');report()" aria-label="Parent caregiver area"></button>
<button id="mic" class="hot" onclick="openM('talkM')" aria-label="Microphone"></button>
<button id="kya" class="hot" onclick="choose('Kya','Calm & gentle')" aria-label="Kya"></button><button id="luna" class="hot" onclick="choose('Luna','Cozy & calm')" aria-label="Luna"></button><button id="buddy" class="hot" onclick="choose('Buddy','Playful')" aria-label="Buddy"></button><button id="audrey" class="hot" onclick="choose('Audrey','Sweet & caring')" aria-label="Audrey"></button><button id="ethan" class="hot" onclick="choose('Ethan','Cool & friendly')" aria-label="Ethan"></button><button id="nova" class="hot" onclick="choose('Nova','Magical')" aria-label="Nova"></button><button id="remi" class="hot" onclick="choose('Remi','Silly & fun')" aria-label="Remi"></button><button id="ziggy" class="hot" onclick="choose('Ziggy','Adventurous')" aria-label="Ziggy"></button>
<button id="voice" class="hot" onclick="openM('voiceM')" aria-label="Choose voice"></button><button id="name" class="hot" onclick="openM('nameM')" aria-label="Name companion"></button><button id="personality" class="hot" onclick="openM('personalityM')" aria-label="Choose personality"></button>
</section></main>

<div class="modalWrap" id="wrap" onclick="if(event.target===this)closeM()"><div class="modal"><button class="close" onclick="closeM()">×</button><div id="modalContent"></div></div></div>
<template id="talkM"><h2>🎙️ Talk to <span class="nm">Kya</span></h2><p>Tell your companion about your day, ask for company, or say what's on your mind.</p><button class="action" onclick="speak('I am right here with you. What would you like to talk about?')">🔊 Hear My Voice</button><p class="small">Natural two-way AI conversation will require the secure AI connection step.</p></template>
<template id="calmM"><h2>🫁 Help Me Calm Down</h2><div class="grid"><button class="card" onclick="calm('Take a slow breath in... and slowly breathe out.')"><b>🌬️ Breathe With Me</b></button><button class="card" onclick="calm('Name five things you can see, four you can feel, three you hear, two you smell, and one thing that helps you feel cared for.')"><b>🌿 5-4-3-2-1</b></button><button class="card" onclick="calm('You do not have to explain anything. I can sit quietly with you.')"><b>🐾 Quiet Time</b></button></div><div id="calmOut"></div></template>
<template id="feelM"><h2>🌈 My Feelings</h2><div class="faces"><button onclick="emo='Happy'">😊</button><button onclick="emo='Okay'">😐</button><button onclick="emo='Sad'">😢</button><button onclick="emo='Angry'">😡</button><button onclick="emo='Worried'">😟</button></div><select id="level"><option>1 - A little</option><option>2</option><option>3 - Medium</option><option>4</option><option>5 - Very big</option></select><textarea id="what" placeholder="What happened?"></textarea><textarea id="help" placeholder="What helped or might help?"></textarea><button class="action" onclick="saveFeel()">Save Check-In</button><p id="feelOut"></p></template>
<template id="gamesM"><h2>🎮 Educational Games</h2><p>Fun practice that can help adults notice learning patterns without diagnosing.</p><div class="grid"><button class="card" onclick="quiz('reading')"><b>🔤 Word Adventure</b>Reading & phonics</button><button class="card" onclick="quiz('math')"><b>➕ Number Quest</b>Math</button><button class="card" onclick="quiz('memory')"><b>🧠 Memory Challenge</b>Memory & focus</button><button class="card" onclick="quiz('sequence')"><b>🔢 Sequencing</b>Order and directions</button><button class="card" onclick="quiz('pattern')"><b>🧩 Pattern Detective</b>Pattern recognition</button><button class="card" onclick="quiz('spelling')"><b>✏️ Spelling</b>Word building</button></div><div id="quizOut"></div></template>
<template id="journalM"><h2>📔 Journal</h2><textarea id="journal" placeholder="Write what's on your mind..."></textarea><button class="action" onclick="saveJournal()">Save Privately</button><p id="journalOut"></p></template>
<template id="learnM"><h2>📚 Learning Adventures</h2><div class="grid"><button class="card" onclick="quiz('reading')"><b>📖 Read With Me</b>Reading practice</button><button class="card" onclick="homework()"><b>✏️ Homework Helper</b>Break work into steps</button><button class="card" onclick="quiz('memory')"><b>🧠 Memory & Focus</b>Practice attention</button><button class="card" onclick="showStrengths()"><b>⭐ My Strengths</b>Celebrate what is going well</button></div><div id="learnOut"></div></template>
<template id="settingsM"><h2>⚙️ Settings</h2><p>Customize your companion without leaving the home screen.</p><button class="soft" onclick="openM('voiceM')">🔊 Choose Voice</button> <button class="soft" onclick="openM('nameM')">✏️ Name</button> <button class="soft" onclick="openM('personalityM')">😊 Personality</button></template>
<template id="voiceM"><h2>🔊 Choose My Voice</h2><select id="voiceSelect"></select><label>Speaking speed</label><input id="rate" type="range" min=".7" max="1.25" step=".05" value=".95"><button class="soft" onclick="preview()">▶ Preview</button></template>
<template id="nameM"><h2>✏️ Name My Companion</h2><input id="newName" placeholder="Companion name"><button class="action" onclick="rename()">Save Name</button></template>
<template id="personalityM"><h2>😊 Choose Personality</h2><select id="persona"><option>Calm & gentle</option><option>Playful</option><option>Encouraging</option><option>Silly & fun</option><option>Cool & friendly</option><option>Adventurous</option></select><button class="action" onclick="savePersona()">Save Personality</button></template>
<template id="parentM"><h2>🔒 Parent/Caregiver Area</h2><p class="small">Prototype preview. Production should use real caregiver authentication, consent, secure storage and controlled sharing.</p><h3>Weekly Report</h3><div id="reportOut"></div><p class="small">Journal text is not included by default. Reports describe observations and practice patterns; they do not diagnose learning or mental-health conditions.</p></template>

<script>
let current=localStorage.getItem("companion")||"Kya",emo="",skills=JSON.parse(localStorage.getItem("skills")||"[]"),feelings=JSON.parse(localStorage.getItem("feelings")||"[]"),voices=[];
function openM(id){let t=document.getElementById(id);modalContent.innerHTML=t.innerHTML;wrap.classList.add("show");refreshNames();if(id==="voiceM")loadVoices()}
function closeM(){wrap.classList.remove("show")}
function refreshNames(){document.querySelectorAll(".nm").forEach(x=>x.textContent=current)}
function choose(n,p){current=n;localStorage.setItem("companion",n);localStorage.setItem("persona",p);speak("Hi! I'm "+n+". I'm happy to be your companion.")}
function rename(){let n=document.getElementById("newName").value.trim();if(n){current=n;localStorage.setItem("companion",n);closeM()}}
function savePersona(){localStorage.setItem("persona",document.getElementById("persona").value);closeM()}
function loadVoices(){voices=speechSynthesis.getVoices();let s=document.getElementById("voiceSelect");if(s)s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} — ${v.lang}</option>`).join("")}
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(t),s=document.getElementById("voiceSelect"),r=document.getElementById("rate");if(s&&voices[+s.value])u.voice=voices[+s.value];u.rate=r?+r.value:.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
function preview(){speak("Hi! I'm "+current+". We can talk, learn, play, or take a calm moment together.")}
function calm(t){calmOut.innerHTML=`<div class=result>${t}<p><b>How do you feel now?</b></p><button class=soft onclick="calmResult('Better')">😊 Better</button> <button class=soft onclick="calmResult('Same')">😐 Same</button> <button class=soft onclick="calmResult('Worse')">😟 Worse</button></div>`;speak(t)}
function calmResult(x){let a=JSON.parse(localStorage.getItem("calms")||"[]");a.push({date:new Date().toISOString(),result:x});localStorage.setItem("calms",JSON.stringify(a))}
function saveFeel(){if(!emo){feelOut.textContent="Choose a feeling first.";return}feelings.push({date:new Date().toISOString(),emotion:emo,level:level.value,what:what.value,help:help.value});localStorage.setItem("feelings",JSON.stringify(feelings));feelOut.textContent="Saved 💗"}
function saveJournal(){let a=JSON.parse(localStorage.getItem("journal")||"[]");a.push({date:new Date().toISOString(),text:journal.value});localStorage.setItem("journal",JSON.stringify(a));journalOut.textContent="Saved privately on this device."}
const Q={reading:["Which word starts with the same sound as sun?",["Sock","Moon"],0],math:["You have 4 apples and get 3 more. How many?",["7","6"],0],memory:["Remember: red, dog, 4. Which was the animal?",["Dog","Red"],0],sequence:["What comes next: first, second, ...?",["Third","Fifth"],0],pattern:["What comes next: ⭐ 🌙 ⭐ 🌙 ...?",["⭐","🌙"],0],spelling:["Which spelling is correct?",["Friend","Freind"],0]};
function quiz(k){let q=Q[k],start=Date.now(),host=document.getElementById("quizOut")||document.getElementById("learnOut");host.innerHTML=`<div class=result><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class=soft onclick="answer('${k}',${i},${q[2]},${start})">${a}</button> `).join("")}<p id=qmsg></p></div>`}
function answer(k,i,ok,start){let correct=i===ok,sec=Math.round((Date.now()-start)/1000);skills.push({date:new Date().toISOString(),skill:k,correct,seconds:sec});localStorage.setItem("skills",JSON.stringify(skills));qmsg.textContent=correct?"Great work! ⭐":"Nice try. We'll practice that kind again later."}
function homework(){learnOut.innerHTML="<div class=result><b>Let's break it down:</b><br>1. What is the question asking?<br>2. What information do you already have?<br>3. What's one small first step?</div>"}
function showStrengths(){let g={};skills.filter(x=>x.correct).forEach(x=>g[x.skill]=(g[x.skill]||0)+1);learnOut.innerHTML=Object.keys(g).length?Object.entries(g).map(x=>`<div class=result><b>⭐ ${x[0]}</b>: ${x[1]} successful practice moment(s).</div>`).join(""):"<p>Complete some Learning Adventures and strengths will appear here.</p>"}
function report(){let r=document.getElementById("reportOut");if(!r)return;let cutoff=Date.now()-7*86400000,s=skills.filter(x=>new Date(x.date).getTime()>=cutoff),f=feelings.filter(x=>new Date(x.date).getTime()>=cutoff),by={};s.forEach(x=>{by[x.skill]??={n:0,c:0,t:[]};by[x.skill].n++;if(x.correct)by[x.skill].c++;by[x.skill].t.push(x.seconds)});let fc={};f.forEach(x=>fc[x.emotion]=(fc[x.emotion]||0)+1);r.innerHTML="<p><b>Learning practice:</b></p>"+(Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class=entry>${k}: ${v.c}/${v.n} correct; avg response ${Math.round(v.t.reduce((a,b)=>a+b,0)/v.t.length)} sec</div>`).join(""):"No learning activities this week.")+"<p><b>Feelings:</b> "+(Object.keys(fc).length?Object.entries(fc).map(x=>x[0]+" ("+x[1]+")").join(", "):"No check-ins this week.")+"</p><div class=result><b>Kya noticed…</b><br>These are observable practice records only. Repeated patterns can be discussed with a parent, teacher, pediatrician, or other qualified professional.</div>"}
</script></body></html>
